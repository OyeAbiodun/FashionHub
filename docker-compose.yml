services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: fashionos
      POSTGRES_PASSWORD: fashionos
      POSTGRES_DB: fashionos
    ports:
      - "5432:5432"
    volumes:
      - fashionos_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fashionos -d fashionos"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  fashionos_postgres_data:
