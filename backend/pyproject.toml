[project]
name = "fashionos-backend"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "alembic>=1.13.2",
  "asyncpg>=0.29.0",
  "cryptography>=45.0.0",
  "email-validator>=2.2.0",
  "fastapi>=0.112.0",
  "greenlet>=3.0.3",
  "pwdlib[argon2]>=0.2.1",
  "pydantic>=2.8.2",
  "pydantic-settings>=2.4.0",
  "PyJWT>=2.9.0",
  "SQLAlchemy>=2.0.32",
  "uvicorn[standard]>=0.30.5",
]

[project.optional-dependencies]
dev = [
  "aiosqlite>=0.20.0",
  "pytest>=8.3.2",
  "pytest-asyncio>=0.23.8",
  "ruff>=0.5.7",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
  "postgres: opt-in integration tests that require TEST_DATABASE_URL",
]

[tool.setuptools.packages.find]
include = ["app*"]
