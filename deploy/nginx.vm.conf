server {
    listen 80;
    server_name fashion.sellingpointnigeria.com _;
    client_max_body_size 2m;
    resolver 127.0.0.11 valid=10s ipv6=off;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type text/plain;
    }

    location / {
        return 301 https://fashion.sellingpointnigeria.com$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name fashion.sellingpointnigeria.com _;
    client_max_body_size 2m;
    resolver 127.0.0.11 valid=10s ipv6=off;

    ssl_certificate /etc/letsencrypt/live/fashion.sellingpointnigeria.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/fashion.sellingpointnigeria.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type text/plain;
    }

    location /api/ {
        set $api_upstream api:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_pass http://$api_upstream;
    }

    location = /docs {
        set $api_upstream api:8000;
        proxy_pass http://$api_upstream;
    }

    location = /openapi.json {
        set $api_upstream api:8000;
        proxy_pass http://$api_upstream;
    }

    location /redoc {
        set $api_upstream api:8000;
        proxy_pass http://$api_upstream;
    }

    location / {
        set $web_upstream web:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_pass http://$web_upstream;
    }
}
